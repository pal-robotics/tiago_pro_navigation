# Configure the Navigation, Localization and SLAM
# nodes:
#   <NODE-NAME>:
#     app: <APP-NAME>
#     params: [<LIST-YAML-PARAM-FILES>]
#
# containers:
#   <CONTAINER-NAME>
#     <NODE-NAME>:
#       app: <APP-NAME>
#       params: [<LIST-YAML-PARAM-FILES>]

containers:
  laser_container:
    sick_571_rear:
      app: sick_driver
      params: [sick_571]
      variables:
        laser_device_id: 0
        laser_frame: "base_rear_laser_link"
        scan_raw_topic: "/scan_rear_raw"
    sick_571_front:
      app: sick_driver
      params: [sick_571]
      variables:
        laser_device_id: 1
        laser_frame: "base_front_laser_link"
        scan_raw_topic: "/scan_front_raw"
    laserscan_multi_merger: 
      app: laserscan_multi_merger  
      params: [default] 
      variables:
        scan_raw_topic_0: "/scan_rear_raw"
        scan_raw_topic_1: "/scan_front_raw"
    pal_laser_filters:
      app: pal_laser_filters
      params: [default]
    dlo_ros:
      app: dlo_ros
      params: [default]
    lifecycle_manager_laser:
      app: lifecycle_manager
      params: [lifecycle_manager_laser_multi]