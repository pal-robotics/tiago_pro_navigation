# Configure the Navigation, Localization and SLAM
# nodes:
#   <NODE-NAME>:
#     app: <APP-NAME>
#     params: [<LIST-YAML-PARAM-FILES>]
#
# containers:
#   <CONTAINER-NAME>
#     <NODE-NAME>:
#       app: <APP-NAME>
#       params: [<LIST-YAML-PARAM-FILES>]

containers:
  head_front_camera_container:
    head_front_camera:
      app: realsense
      params: [d435_rgbd_high_accuracy]
      namespace: "head_front_camera"
      variables:
        camera_name: ${head_front_camera_name}
        serial_no: "_"